name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Packaging and pytest both resolve the `agent` package from the
      # parent directory (where=[".."], pythonpath=[".."]), so the repo
      # must live in a directory literally named "agent".
      - uses: actions/checkout@v4
        with:
          path: agent

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agent/pyproject.toml

      # Shell/security tests exercise the real sandbox (require_sandbox is the
      # default). Ubuntu 24.04 blocks unprivileged user namespaces via
      # AppArmor, which bwrap needs.
      - name: Sandbox backend
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap libseccomp2
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --unshare-user --unshare-pid --ro-bind / / -- true

      - name: Install
        working-directory: agent
        run: pip install -e ".[dev]"

      - name: Unit + integration tests (offline)
        working-directory: agent
        run: pytest tests/unit tests/integration -q -o faulthandler_timeout=120
