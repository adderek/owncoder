name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Packaging and pytest both resolve the `agent` package from the
      # parent directory (where=[".."], pythonpath=[".."]), so the repo
      # must live in a directory literally named "agent".
      - uses: actions/checkout@v4
        with:
          path: agent

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agent/pyproject.toml

      - name: Install
        working-directory: agent
        run: pip install -e ".[dev]"

      - name: Unit + integration tests (offline)
        working-directory: agent
        run: pytest tests/unit tests/integration -q
