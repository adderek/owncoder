[project]
name = "local-code-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "tree-sitter>=0.21",
    "tree-sitter-python",
    "tree-sitter-c",
    "tree-sitter-cpp",
    "tree-sitter-bash",
    "sqlite-vec>=0.1",
    "openai>=1.0",
    "textual>=0.50",
    "tiktoken>=0.6",
    "rich>=13.0",
    "pathspec>=0.12",
    "watchdog>=3.0",
    "pyyaml>=6.0",
    "numpy>=2.4.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-watch>=4.2",
]
# Extra grammars for projects that are not Python/C/C++/bash. The chunker falls
# back to line-based splitting when a grammar is missing, so these are optional.
lang = [
    "tree-sitter-javascript",
    "tree-sitter-typescript",
    "tree-sitter-rust",
    "tree-sitter-go",
    "tree-sitter-java",
    "tree-sitter-kotlin",
]
graph = [
    "graphifyy>=0.1.14",
]
notify = [
    "websockets>=12",
    "cryptography>=42",
]
vault = [
    # Argon2id landed in cryptography 44 and needs OpenSSL 3.2+ underneath.
    "cryptography>=44",
]
speech = [
    "faster-whisper>=1.0",
    "soundfile>=0.12",
    "numpy>=1.24",
]

[project.scripts]
agent = "agent.main:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# ".." makes `agent.*` importable from a source checkout; "../kb/src" is the
# sibling kb package, which is src-layout and therefore invisible from ".."
# alone. Without it the whole integration suite skipped itself as "kb package
# not installed" and had never once run.
pythonpath = ["..", "../kb/src"]
markers = [
    "integration: tests against the kb fixture corpus (no LLM, no network)",
]
# Concurrent pytest sessions (e.g. parallel agent workers) share
# /tmp/pytest-of-<user>/; the default retention (3) lets one session prune
# another LIVE session's tmp roots mid-run, randomly breaking disk-backed
# tests (seen in test_prompt_compiler A/B index round-trips).
tmp_path_retention_count = 50
# Delete a passing test's tmp_path right away, and the whole session base dir
# when every test passed; only failures leave files behind to debug. A full
# unit run leaves ~7.7k files otherwise, and inside the agent sandbox /tmp is
# the project scratch (.agent/tmp), so 50 retained runs pushed the sandbox's
# per-command file scan past its cap. Keep everything for one run with:
#   pytest -o tmp_path_retention_policy=all
tmp_path_retention_policy = "failed"

[tool.setuptools.packages.find]
where = [".."]
include = ["agent*"]
# The suite is not runtime. agent/tests/{,unit,integration} carry __init__.py,
# so `agent*` matches them and the wheel shipped the whole suite (234 entries in
# SOURCES.txt). Keep them in the source tree / dev install, out of the artifact.
exclude = ["agent.tests", "agent.tests.*"]

[tool.setuptools.package-data]
"agent.ui" = ["static/*.css", "static/*.js"]
