id: fix-failing-test
prompt: "The test in test_calc.py fails. Find the bug in calc.py and fix it so the test passes. Do not modify test_calc.py."
fixture: fix-failing-test
timeout_s: 300
checks:
  - type: command
    run: "python -m pytest test_calc.py -q"
  - type: file_contains
    path: calc.py
    text: "return a + b"
