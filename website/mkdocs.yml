site_name: owncoder
site_url: https://adderek.github.io/owncoder/
repo_url: https://github.com/adderek/owncoder
edit_uri: edit/master/website/docs/
docs_dir: docs
site_dir: _site
strict: true

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - content.code.copy
    - search.suggest

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Interfaces: interfaces.md
  - Install: install.md
  - Quickstart: quickstart.md
  - Configuration: configuration.md
  - Security: security.md
  - Subagents & models: subagents.md
  - Code understanding: code-understanding.md
  - Relay & Android: relay.md
