</text><text class="text-tool-r2" x="1220" y="361.6" textLength="12.2" clip-path="url(#text-tool-line-14)">
</text><text class="text-tool-r2" x="0" y="386" textLength="683.2" clip-path="url(#text-tool-line-15)">Fix:&#160;clamp&#160;the&#160;loop&#160;with&#160;`i&#160;&lt;&#160;n&#160;&amp;&amp;&#160;rb-&gt;count&#160;&lt;&#160;rb-&gt;cap`.</text><text class="text-tool-r2" x="1220" y="386" textLength="12.2" clip-path="url(#text-tool-line-15)">
