</text><text class="text-tool-r2" x="0" y="264" textLength="683.2" clip-path="url(#text-tool-line-10)">Yes.&#160;`ringbuf_write`&#160;never&#160;checks&#160;`count`&#160;against&#160;`cap`.</text><text class="text-tool-r2" x="1220" y="264" textLength="12.2" clip-path="url(#text-tool-line-10)">
</text><text class="text-tool-r2" x="1220" y="288.4" textLength="12.2" clip-path="url(#text-tool-line-11)">
</text><text class="text-tool-r2" x="0" y="312.8" textLength="805.2" clip-path="url(#text-tool-line-12)">-&#160;When&#160;the&#160;buffer&#160;is&#160;full,&#160;`head`&#160;wraps&#160;and&#160;overwrites&#160;unread&#160;data</text><text class="text-tool-r2" x="1220" y="312.8" textLength="12.2" clip-path="url(#text-tool-line-12)">
